# Per-corner vehicle parameter sets (SI). Every value carries a provenance
# tag: [LITERATURE] cited; [DERIVED] formula shown; [ESTIMATE] engineering
# estimate listed in docs/09_open_parameters.md.  Quarter-car corner = one
# wheel station; sprung mass = (curb or GVW share on that axle)/2 - m_u.
#
# Design rules used for [DERIVED] entries (Gillespie, Fundamentals of Vehicle
# Dynamics, ch. 5; Zuo & Zhang 2013 Table 1 for the mid-size car):
#   body (ride) frequency f_b = 1.1-1.3 Hz cars/pickups, 1.5-2.0 Hz trucks laden
#   k_m = (2 pi f_b)^2 m_s (ride rate ~ k_m since k_t >> k_m)
#   damping ratio zeta = 0.25-0.35 -> c_s = 2 zeta sqrt(k_m m_s)
#   tire rate: cars 180-220 kN/m, light trucks 250-350 kN/m, truck tires 800-1200 kN/m
#   per tire (dual tires double).

midsize_car:
  note: "mid-size car; the validation (b) vehicle. Values are literature-typical for a ~1600 kg sedan; Zuo & Zhang 2013 Table 1 itself was NOT retrievable in this environment (docs/04_prior_art.md item 2), so these are not claimed to be its numbers."
  m_s: {value: 400.0, units: kg, provenance: "[LITERATURE] typical mid-size sedan quarter-car sprung mass, 1600 kg class (Gillespie ch.5); consistent with values commonly used in regenerative-suspension studies"}
  m_u: {value: 40.0, units: kg, provenance: "[LITERATURE] typical passenger-car corner unsprung mass 35-50 kg (Gillespie ch.5)"}
  k_m: {value: 20000.0, units: N/m, provenance: "[DERIVED] f_b = 1.1 Hz: (2 pi 1.1)^2 * 400 ~ 19 kN/m, rounded"}
  c_s: {value: 1500.0, units: N.s/m, provenance: "[DERIVED] zeta = 0.27"}
  k_t: {value: 180000.0, units: N/m, provenance: "[LITERATURE] passenger radial tire 160-220 kN/m (Gillespie ch.10)"}
  gate_mass: {value: 10.0, units: kg, provenance: "[ESTIMATE] housing+generator+flyweights per corner; open"}

f150:
  note: "full-size pickup, curb ~2500 kg, light load"
  m_s: {value: 560.0, units: kg, provenance: "[DERIVED] 2500 kg / 4 - 65 kg"}
  m_u: {value: 65.0, units: kg, provenance: "[LITERATURE] light-truck corner unsprung 50-80 kg (Gillespie ch.5)"}
  k_m: {value: 32000.0, units: N/m, provenance: "[DERIVED] f_b = 1.2 Hz: (2 pi 1.2)^2 * 560"}
  c_s: {value: 2900.0, units: N.s/m, provenance: "[DERIVED] zeta = 0.34"}
  k_t: {value: 250000.0, units: N/m, provenance: "[LITERATURE] LT tire 250-300 kN/m"}
  gate_mass: {value: 12.0, units: kg, provenance: "[ESTIMATE] open"}

