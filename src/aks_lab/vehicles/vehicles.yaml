  k_m: {value: 70000.0, units: N/m, provenance: "[DERIVED] f_b = 1.3 Hz laden"}
  c_s: {value: 5100.0, units: N.s/m, provenance: "[DERIVED] zeta = 0.30"}
  k_t: {value: 320000.0, units: N/m, provenance: "[LITERATURE] LT-E tire ~300-350 kN/m"}
