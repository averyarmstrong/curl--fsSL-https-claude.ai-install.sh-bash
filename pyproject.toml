[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aks-lab"
version = "0.2.0.dev0"
description = "AKS Lab: measurable, reproducible models of the US 12,409,695 B2 suspension energy reclamation generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
fast = ["numba>=0.59"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "validation: literature-anchor validation (slower)",
    "slow: long-running simulations",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E702", "E401", "E402"]
"reports/*" = ["E702"]
