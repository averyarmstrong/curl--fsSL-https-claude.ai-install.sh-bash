loads_Nms: [0.0, 2.0e-5, 5.0e-5, 1.0e-4, 2.0e-4, 5.0e-4]
hands: [[15, 1.0], [30, 1.0], [15, 2.0], [30, 2.0]]   # [N at rest, m/s where force -> 0]
spin_down_s: 10.0
