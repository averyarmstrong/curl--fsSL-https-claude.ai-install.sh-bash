# Experiment 007 — Monte Carlo uncertainty bands over the OPEN parameters
# (docs/09_open_parameters.md) at the ride/handling-constrained design point
# from reports/linear_frontier.md, for the headline vehicles and road classes.
# Latin-hypercube in log space for scale parameters; each sample gets its own
# road seed so road realisation scatter is included in the band.
vehicles: [midsize_car, f150, hmmwv, class8_loaded]
classes: [B, C, D]
speed_mps: 26.82
duration_s: 40.0
n_samples: 48
design:                      # constrained optimum neighbourhood (linear frontier)
  r: 300.0
  c_eq_target: 450.0         # c_gen = c_eq / r^2
  c_s_scale: 0.75
  k_b_over_k_m: 0.12
  travel: 0.1016
ranges:                      # [low, high], log-uniform unless noted
  J:            [0.00001, 0.0003]
  c_eq_target:  [250.0, 800.0]
  c_b:          [20.0, 500.0]
  c_od:         [0.00005, 0.001]
  c_w:          [0.00001, 0.0005]
  theta_bl:     [0.0, 0.0087]      # uniform
  k_b_over_k_m: [0.06, 0.3]
  travel:       [0.0635, 0.127]    # uniform
  eq_fraction:  [0.35, 0.65]       # uniform
  eta:          [0.75, 0.92]       # uniform
  m_f:          [4.0, 12.0]        # uniform
  delta_m_scale: [0.6, 1.8]        # multiplies the vehicle gate_mass estimate; uniform
