name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,fast]"
      - name: Lint
        run: ruff check src tests experiments
      - name: Unit, analytic-limit and conservation tests
        run: pytest -q -m "not slow"
