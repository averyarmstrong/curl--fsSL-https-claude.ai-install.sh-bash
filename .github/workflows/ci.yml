name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: V1 gates + unit tests
        run: pytest -q -m "not validation and not slow"
      - name: Validation anchors (V2-V4)
        run: pytest -q -m validation
        continue-on-error: true  # remove once V2-V4 are implemented and passing
